<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartu Misteri MTs DDI Kel. Baru</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Container Utama */
    .game-container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 25px 35px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(45deg, #00f2fe, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #8a99ad;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    /* Panel Statistik */
    .dashboard {
      display: flex;
      justify-content: space-around;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px 15px;
      border-radius: 12px;
      margin-bottom: 25px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 1.2rem;
      font-weight: bold;
      color: #00f2fe;
    }

    /* Grid Kartu */
    .grid {
      display: grid;
      gap: 12px;
      justify-content: center;
      margin: 0 auto;
      perspective: 1000px;
    }

    /* Ukuran Grid Dinamis */
    .grid.easy { grid-template-columns: repeat(4, 75px); }
    .grid.medium { grid-template-columns: repeat(4, 75px); }
    .grid.hard { grid-template-columns: repeat(4, 70px); }

    .card {
      width: 75px;
      height: 95px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    .grid.hard .card {
      width: 70px;
      height: 90px;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .card-front {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 2px solid #334155;
      color: #38bdf8;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .card-back {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border: 2px solid #38bdf8;
      transform: rotateY(180deg);
    }

    .card-back svg {
      width: 38px;
      height: 38px;
      fill: #ffffff;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    .card.matched .card-back {
      background: linear-gradient(135deg, #059669, #047857);
      border-color: #34d399;
      animation: pulse 0.4s ease-in-out;
    }

    @keyframes pulse {
      0% { transform: rotateY(180deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.1); }
      100% { transform: rotateY(180deg) scale(1); }
    }

    /* Modal / Pop-Up Modern */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 15, 30, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 35px 30px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      transform: translateY(20px) scale(0.95);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0) scale(1);
    }

    .modal-title {
      font-size: 1.6rem;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .modal-text {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    .level-select {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 25px;
    }

    .level-btn {
      background: #0f172a;
      border: 2px solid #334155;
      color: #f8fafc;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .level-btn.selected, .level-btn:hover {
      border-color: #38bdf8;
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    .btn-action {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(2, 132, 199, 0.4);
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px rgba(2, 132, 199, 0.6);
    }

    .restart-btn {
      margin-top: 20px;
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .restart-btn:hover {
      color: #ffffff;
      border-color: #38bdf8;
    }
  </style>
</head>
<body>

  <!-- Game Container -->
  <div class="game-container">
    <h1>MTs DDI KEL. BARU</h1>
    <p class="subtitle">Kartu Misteri — Uji Ingatan & Kecepatanmu!</p>

    <div class="dashboard">
      <div class="stat-item">
        <span class="stat-label">Langkah</span>
        <span class="stat-value" id="moves">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Waktu</span>
        <span class="stat-value" id="timer">--</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Skor</span>
        <span class="stat-value" id="score">0/0</span>
      </div>
    </div>

    <div class="grid" id="grid"></div>

    <button class="restart-btn" onclick="openStartModal()">Atur Ulang / Ganti Level</button>
  </div>

  <!-- Pop-Up Modal Start Game -->
  <div class="modal-overlay active" id="startModal">
    <div class="modal-card">
      <h2 class="modal-title">Selamat Datang!</h2>
      <p class="modal-text">Pilih tingkat kesulitan untuk memulai permainan Kartu Misteri MTs DDI Kel. Baru.</p>
      
      <div class="level-select">
        <button class="level-btn selected" onclick="selectLevel('easy', this)">Mudah (8 Kartu • 40s)</button>
        <button class="level-btn" onclick="selectLevel('medium', this)">Sedang (12 Kartu • 35s)</button>
        <button class="level-btn" onclick="selectLevel('hard', this)">Misteri Sulit (16 Kartu • 30s)</button>
      </div>

      <button class="btn-action" onclick="startGame()">START GAME</button>
    </div>
  </div>

  <!-- Pop-Up Modal Result -->
  <div class="modal-overlay" id="resultModal">
    <div class="modal-card">
      <h2 class="modal-title" id="resultTitle">Misteri Terkuak!</h2>
      <p class="modal-text" id="resultText">Kamu berhasil menyelesaikan permainan tepat waktu.</p>
      <button class="btn-action" onclick="openStartModal()">Main Lagi</button>
    </div>
  </div>

  <script>
    // Ikon SVG Vektor Modern
    const svgIcons = [
      `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>`, // Bintang
      `<svg viewBox="0 0 24 24"><path d="M12 1L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 1Z"/></svg>`, // Perisai
      `<svg viewBox="0 0 24 24"><path d="M12 21.35L10.55 20.03C5.4 15.36 2 12.27 2 8.5C2 5.41 4.42 3 7.5 3C9.24 3 10.91 3.81 12 5.08C13.09 3.81 14.76 3 16.5 3C19.58 3 22 5.41 22 8.5C22 12.27 18.6 15.36 13.45 20.03L12 21.35Z"/></svg>`, // Hati
      `<svg viewBox="0 0 24 24"><path d="M13 2L3 14H12L11 22L21 10H12L13 2Z"/></svg>`, // Petir
      `<svg viewBox="0 0 24 24"><path d="M12 3L1 9L12 15L21 10.09V17H23V9M5 13.18V17.18L12 21L19 17.18V13.18L12 17L5 13.18Z"/></svg>`, // Toga Sekolah
      `<svg viewBox="0 0 24 24"><path d="M18 2H6C4.9 2 4 2.9 4 4V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V4C20 2.9 19.1 2 18 2ZM6 4H11V12L8.5 10.5L6 12V4Z"/></svg>`, // Buku
      `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20ZM12.5 7H11V13L16.2 16.2L17 14.9L12.5 12.2V7Z"/></svg>`, // Jam
      `<svg viewBox="0 0 24 24"><path d="M12 2A10 10 0 0 0 2 12A10 10 0 0 0 12 22A10 10 0 0 0 22 12A10 10 0 0 0 12 2M12 4A8 8 0 0 1 20 12A8 8 0 0 1 12 20A8 8 0 0 1 4 12A8 8 0 0 1 12 4Z"/></svg>` // Target
    ];

    const levelConfig = {
      easy: { pairs: 4, time: 40, class: 'easy' },
      medium: { pairs: 6, time: 35, class: 'medium' },
      hard: { pairs: 8, time: 30, class: 'hard' }
    };

    let selectedDifficulty = 'easy';
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let timer;
    let timeLeft = 0;
    let lockBoard = false;

    function selectLevel(level, element) {
      selectedDifficulty = level;
      document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('selected'));
      element.classList.add('selected');
    }

    function openStartModal() {
      clearInterval(timer);
      document.getElementById('resultModal').classList.remove('active');
      document.getElementById('startModal').classList.add('active');
    }

    function startGame() {
      document.getElementById('startModal').classList.remove('active');
      document.getElementById('resultModal').classList.remove('active');
      
      const config = levelConfig[selectedDifficulty];
      matchedPairs = 0;
      moves = 0;
      lockBoard = false;
      timeLeft = config.time;
      flippedCards = [];

      document.getElementById('moves').innerText = moves;
      document.getElementById('timer').innerText = `${timeLeft}s`;
      document.getElementById('score').innerText = `0/${config.pairs}`;

      createBoard(config);
      startTimer();
    }

    function createBoard(config) {
      const grid = document.getElementById('grid');
      grid.className = `grid ${config.class}`;
      grid.innerHTML = '';

      const activeIcons = svgIcons.slice(0, config.pairs);
      const deck = shuffle([...activeIcons, ...activeIcons]);

      deck.forEach((svgContent) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.icon = svgContent;

        card.innerHTML = `
          <div class="card-face card-front">DDI</div>
          <div class="card-face card-back">${svgContent}</div>
        `;

        card.addEventListener('click', flipCard);
        grid.appendChild(card);
      });
    }

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function startTimer() {
      clearInterval(timer);
      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = `${timeLeft}s`;

        if (timeLeft <= 0) {
          clearInterval(timer);
          endGame(false);
        }
      }, 1000);
    }

    function flipCard() {
      if (lockBoard || this.classList.contains('flipped') || this.classList.contains('matched')) return;

      this.classList.add('flipped');
      flippedCards.push(this);

      if (flippedCards.length === 2) {
        moves++;
        document.getElementById('moves').innerText = moves;
        checkMatch();
      }
    }

    function checkMatch() {
      const [card1, card2] = flippedCards;
      const config = levelConfig[selectedDifficulty];

      if (card1.dataset.icon === card2.dataset.icon) {
        card1.classList.add('matched');
        card2.classList.add('matched');
        matchedPairs++;
        document.getElementById('score').innerText = `${matchedPairs}/${config.pairs}`;
        flippedCards = [];

        if (matchedPairs === config.pairs) {
          clearInterval(timer);
          setTimeout(() => endGame(true), 400);
        }
      } else {
        lockBoard = true;
        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          flippedCards = [];
          lockBoard = false;
        }, 800);
      }
    }

    function endGame(isWin) {
      const modal = document.getElementById('resultModal');
      const title = document.getElementById('resultTitle');
      const text = document.getElementById('resultText');

      if (isWin) {
        title.innerText = "🎉 Misteri Terkuak!";
        title.style.color = "#34d399";
        text.innerText = `Luar biasa! Kamu menyelesaikan level ${selectedDifficulty.toUpperCase()} dalam ${moves} langkah dengan sisa waktu ${timeLeft} detik.`;
      } else {
        title.innerText = "⏱️ Waktu Habis!";
        title.style.color = "#f87171";
        text.innerText = "Misteri gagal terkuak. Tetap semangat, coba lagi dan kalahkan waktu!";
      }

      modal.classList.add('active');
    }
  </script>
</body>
</html>
